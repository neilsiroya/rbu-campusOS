name: Feature request
description: Suggest an idea for CampusOS.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a change or new capability for CampusOS. Be specific about the problem it solves.
  - type: input
    id: module
    attributes:
      label: Related module
      description: Which campus module or area does this affect (e.g. Study Hub, Events, Profile)?
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the issue or gap you're trying to address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include any interaction details or examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you thought about.
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I searched for an existing request before filing this one.
          required: true